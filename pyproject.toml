[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "1.1.0"
description = "A small execution standard for infrastructure automation"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
secrets = ["bitwarden-sdk==2.1.0"]
dev = [
  "build==1.5.0",
  "coverage[toml]==7.15.2",
  "pytest==9.1.1",
  "ruff==0.16.1",
  "shibuya==2026.7.12; python_version >= '3.12'",
  "sphinx==9.1.0; python_version >= '3.12'",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "atlas",
  "atlas.*",
  "atlas_core",
  "atlas_core.*",
]

[tool.setuptools.dynamic]
dependencies = {file = ["src/atlas/support-requirements.txt"]}

[tool.setuptools.package-data]
atlas = ["support-requirements.txt"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  # Syntax, imports, and undefined names.
  "E4",
  "E7",
  "E9",
  "F",
  # Common bug patterns and deterministic imports.
  "B",
  "I",
  # The package supports Python 3.11 and newer only.
  "UP",
  # High-signal Ruff correctness checks.
  "RUF",
  # Unsafe execution and silently discarded exceptions.
  "S102",
  "S110",
  "S112",
  # Archive and YAML loading require reviewed, local suppressions.
  "S202",
  "S506",
  # Subprocess callers must choose exit-code behavior explicitly.
  "PLW1510",
  # Input types, parametrized cases, and context-manager return types.
  "TRY004",
  "PT014",
  "PYI034",
]

[tool.coverage.run]
branch = true
source = [
  "src",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
