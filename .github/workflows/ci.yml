name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip==26.2
          python -m pip install -e '.[dev,secrets]'
          python -m pip check
      - run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - run: ruff check src tests
      - run: python -m build
      - if: matrix.python-version == '3.14'
        run: make clean-docs html SPHINXOPTS=-W
      - name: Smoke test local programs
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIMES_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtimes
          ATLAS_VENVS_DIR: ${{ github.workspace }}/.ci/opt/atlas/venvs
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          version: 1
          host:
            id: ci-host
            role: test
            site: ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<C
          runtime:
            python:
              version: "${{ matrix.python-version }}"
              executable: "$(command -v python)"
          programs:
            basic:
              root: ${{ github.workspace }}/examples/basic-program
              runtime:
                type: python
                python: "${{ matrix.python-version }}"
                venv: basic
            native:
              root: ${{ github.workspace }}/examples/native-program
              runtime:
                type: native
          C
          atlas runtime install
          atlas venv create basic
          atlas command list
          atlas shim generate
          atlas run hello ci-user
          atlas run native-echo from-ci
          test -s "$ATLAS_VAR_DIR/logs/runs.jsonl"

  container:
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime --tag atlas-runtime-ci .
      - run: docker run --rm atlas-runtime-ci
